# Global defaults. Experiment configs in configs/experiments/ override these via `_base_`.
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs
  cache: outputs/cache

data:
  dataset: alqac2024          # alqac2024 | alqac2025 | zalo | vilegalexperts
  split: test

datasets:                     # paths relative to paths.raw
  alqac2024:
    format: article_level
    corpus: alqac/ALQAC_2024/law.json
    test: [alqac/ALQAC_2024/public_test_GOLD.json, alqac/ALQAC_2024/private_test_GOLD.json]
    dev: alqac/ALQAC_2024/train.json          # prompt design only (100 expert-verified questions)
  alqac2025:
    format: article_level
    corpus: alqac/ALQAC_2025/law.json
    test: [alqac/ALQAC_2025/private_test_GOLD.json]
  zalo:
    format: article_level
    corpus: alqac/additional_data/zalo/zalo_corpus.json
    test: [alqac/additional_data/zalo/zalo_question.json]
    retrieval_only: true
    article_titles: false                      # Zalo articles have no title line
  vilegalexperts:
    format: full_text
    corpus: vilegalexperts/contexts            # one JSON per document: {link, name, passage, id}
    test: [vilegalexperts/QA_single_context/test_data.json]
    require_released_context: true             # keep only test questions whose document is released (773)
    silver_article_labels: true                # article refs parsed from the expert answer

parsing:
  fallback_to_article: true   # unparsable documents -> article-level units

indexing:
  unit: clause                # clause | article | fixed
  breadcrumbs: true
  segmenter: pyvi             # pyvi | underthesea
  max_unit_tokens: 512        # longer units are split on line boundaries (bge-m3 tokens)
  max_article_tokens: 4096    # B2 article units: split only beyond the largest budget
  fixed_chunk:                # B1 baseline
    size: 256
    overlap: 32

retrieval:
  bm25: true
  dense: true
  rrf_k: 60
  bm25_weight: 0.5             # weighted RRF; chosen on the ALQAC 2024 dev set (100 questions) only
  dense_weight: 1.0
  candidates: 200             # units returned by each retriever before fusion
  top_k_units: 50
  top_k_articles: 10
  aggregation: max            # max | sum_top2 | none (rank clauses directly)

expansion:
  enabled: true
  parent_lead_in: true
  cross_refs: true
  max_hops: 1
  xref_decay: 0.5             # referenced unit score = source score x decay
  max_targets: 8              # referenced units added per source unit

packing:
  budget: 2048                # one of 1024 | 2048 | 4096, generator tokens incl. prompt template
  strategy: score_per_token   # score_per_token | topk_truncate
  length_exponent: 0.0        # priority = score / tokens^exponent; 0 chosen on dev (1.0 lowered context recall 0.98 -> 0.80 at B=1024)
  article_weight: 0.5         # priority blends article (max) score and unit score; 0 when aggregation is none
  max_candidates: 60

generation:
  generator: qwen2.5-3b
  backend: vllm               # vllm | llamacpp
  temperature: 0.0
  max_new_tokens: 512
  prompt: v1                  # v0 instruction only | v1 + placeholder citation format (chosen on dev)
  verify_citations: true

evaluation:
  retrieval_k: [1, 3, 5, 10]
  mrr_k: 10
  bootstrap_samples: 1000
  ci: 0.95
  judge: true
