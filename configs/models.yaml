generators:
  qwen2.5-1.5b: {hf_id: Qwen/Qwen2.5-1.5B-Instruct}
  qwen2.5-3b:   {hf_id: Qwen/Qwen2.5-3B-Instruct}
  qwen3-1.7b:   {hf_id: Qwen/Qwen3-1.7B, enable_thinking: false}
  sailor2-1b:   {hf_id: sail/Sailor2-1B-Chat}
  # bf16 weights (15 GB) do not leave room for the KV cache on a 16 GB GPU: weights are quantised to FP8 in vLLM.
  qwen2.5-7b:   {hf_id: Qwen/Qwen2.5-7B-Instruct, upper_bound: true, engine_kwargs: {quantization: fp8}, gpu_memory_utilization: 0.92}

retrievers:
  dense:
    hf_id: BAAI/bge-m3
    max_length: 512
    batch_size: 32
    fp16: true
  sparse:
    library: bm25s

judge:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-haiku-5.5   # one fixed model version for all runs
  temperature: 0.0
  api_key_env: OPENROUTER_API_KEY
